name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            g++ \
            libx11-dev \
            libxft-dev \
            libxmu-dev \
            libxrandr-dev \
            libxinerama-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libpng-dev \
            libjpeg-dev \
            libpam0g-dev

      - name: Configure
        run: cmake -B build -DUSE_PAM=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)
